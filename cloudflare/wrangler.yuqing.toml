# 舆情日报 Worker：部署后与自定义域 yuqing.feiniwork.com 绑定。
#   cd cloudflare
#   npx wrangler deploy --config wrangler.yuqing.toml
# Secrets:
#   npx wrangler secret put FINNHUB_API_KEY --config wrangler.yuqing.toml
# Provider（也可在控制台改 vars）：
#
# 自定义域若在 wrangler deploy 时不自动下发，请到 Cloudflare 控制台为该 Worker 添加 Custom Domain: yuqing.feiniwork.com

name = "yuqing"
main = "yuqing/yuqing-worker.js"
compatibility_date = "2024-12-01"
workers_dev = true
preview_urls = true

[[routes]]
pattern = "yuqing.feiniwork.com"
custom_domain = true
zone_name = "feiniwork.com"

[[routes]]
pattern = "yuqing.feiniwork.com/*"
zone_name = "feiniwork.com"

[vars]
ACCESS_ALLOWED_ORIGINS = "https://bitcoin.feiniwork.com,http://localhost:5173,http://127.0.0.1:5173"
# Cloudflare Access JWT defense-in-depth:
# 1) Create an Access self-hosted app for yuqing.feiniwork.com/*.
# 2) Copy the app AUD tag and set ACCESS_AUD in the Cloudflare dashboard.
# 3) Set ACCESS_TEAM_DOMAIN to <your-team>.cloudflareaccess.com.
# 4) Set ACCESS_JWT_REQUIRED=true after both values are present.
# ACCESS_TEAM_DOMAIN = "CHANGE_ME.cloudflareaccess.com"
# ACCESS_AUD = "CHANGE_ME"
# ACCESS_ALLOWED_EMAILS = "you@example.com"
# ACCESS_JWT_REQUIRED = "true"
# Optional service token headers for calls from yuqing -> btc when btc is also Access-protected:
# ACCESS_SERVICE_CLIENT_ID and ACCESS_SERVICE_CLIENT_SECRET should be encrypted Worker secrets.
# MAINTENANCE_MODE = "false"

# D1（舆情专用，与 btc 无关）。请先执行：
#   npx wrangler d1 create yuqing
# 再用控制台显示的 database_id 替换下方占位符。
# 初始化表结构：
#   npx wrangler d1 execute yuqing --remote --file=cloudflare/migrations/yuqing/0001_init.sql
#   npx wrangler d1 execute yuqing --remote --file=cloudflare/migrations/yuqing/0002_reports.sql

[[d1_databases]]
binding = "YUQING_DB"
database_name = "yuqing"
database_id = "e89cfebb-2d98-4f10-ae94-4f5f4fe52a8f"

# 自动模型报告已退役，不再定时触发。

[triggers]
crons = []

# Secrets（示例，勿写密钥进仓库）：
#   npx wrangler secret put CRON_SECRET --config wrangler.yuqing.toml        # POST /api/yuqing/ingest 时需 X-Yuqing-Cron-Secret
#   npx wrangler secret put FINNHUB_API_KEY --config wrangler.yuqing.toml

# 若已为 feiniwork.com 分区授权 wrangler，可取消注释绑定路由（任选其一）：
# [[routes]]
# pattern = "yuqing.feiniwork.com/*"
# zone_name = "feiniwork.com"
