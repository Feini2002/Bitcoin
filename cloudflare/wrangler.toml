# 与 Cloudflare 控制台一致：Worker 名 btc，自定义域 btc.feiniwork.com，D1 库名 btc、绑定名 DB。
# 见 binance-klines-worker.js 内注释。
#
# D1（线上库「btc」）建表或迁移后在仓库 cloudflare 目录执行：
#   npx wrangler d1 execute btc --remote --file=./schema.sql
# Worker 发布后：
#   npx wrangler deploy

name = "btc"
main = "binance-klines-worker.js"
compatibility_date = "2024-12-01"

# Smart Placement: 让 Worker 执行位置贴近 fapi.binance.com（东京/新加坡），
# 使出站 IP 落在亚太非受限区，避免币安 451 地域拦截。
[placement]
mode = "smart"

# D1 数据库绑定：Worker 里用 env.DB 访问已部署 D1。
# database_id：在控制台创建或与 `wrangler d1 create` 输出对齐后填入。
[[d1_databases]]
binding = "DB"
database_name = "btc"
database_id = "de758bb8-c7f5-41c7-a6ea-32c0ddf74d57"

[[durable_objects.bindings]]
name = "LIQUIDATION_COLLECTOR"
class_name = "LiquidationCollector"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LiquidationCollector"]

# 定时触发：每分钟一次；Worker 内部按时间判断 K 线周期，footprint/强平/衍生品各自用冷却与增量逻辑控频。
# 免费版 Workers 的 Cron Triggers 也支持。
[triggers]
crons = ["* * * * *"]

# 可选：Gemini（与 yuqing 共用 Secret 名 GEMINI_API_KEY / GOOGLE_API_KEY）
#   npx wrangler secret put GEMINI_API_KEY
# LLM：`BTC_LLM_PROVIDER=none|gemini|auto`（默认 auto，有密钥则视为可用；亦可在控制台设置）
[vars]
BTC_LLM_PROVIDER = "auto"
ACCESS_ALLOWED_ORIGINS = "https://bitcoin.feiniwork.com"
# Cloudflare Access JWT defense-in-depth:
# 1) Create an Access self-hosted app for btc.feiniwork.com/*.
# 2) Copy the app AUD tag and set ACCESS_AUD in the Cloudflare dashboard.
# 3) Set ACCESS_TEAM_DOMAIN to <your-team>.cloudflareaccess.com.
# 4) Set ACCESS_JWT_REQUIRED=true after both values are present.
# ACCESS_TEAM_DOMAIN = "CHANGE_ME.cloudflareaccess.com"
# ACCESS_AUD = "CHANGE_ME"
# ACCESS_ALLOWED_EMAILS = "you@example.com"
# ACCESS_JWT_REQUIRED = "true"

# 可选的反代基址（仅当 Cloudflare 直连 fapi 被 451 时使用）。
# 对应代码里的 BINANCE_FAPI_ORIGIN。
# [vars]
# BINANCE_FAPI_ORIGIN = "https://你的反代.example.com"
# SYMBOLS：默认 BTCUSDT。本系统行情数据以比特币为主，一般不配置多交易对。
#
# 静态前端（Cloudflare Pages）：在仓库根目录执行 npm run deploy:pages（project-name=bit-trading-desk）。
# deploy 脚本含 --branch main：与控制台 production branch 一致；若本地在 master 且省略 --branch，直连上传会落入 Preview，自定义域仍指向旧 Production。
# 部署成功后脚本会自动 prune：production/preview 各自仅保留最新 BIT_PAGES_KEEP 条（默认 8）。
# 首次需先创建项目：npx wrangler pages project create bit-trading-desk --production-branch=main
# 绑定自定义域：控制台 Workers & Pages → bit-trading-desk → Custom domains。
