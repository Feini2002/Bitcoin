# 与 Cloudflare 控制台一致：Worker 名 btc，自定义域 btc.feiniwork.com，D1 库名 btc、绑定名 DB。
# 见 binance-klines-worker.js 内注释。
#
# D1（线上库「btc」）建表或迁移后在仓库 cloudflare 目录执行：
#   npx wrangler d1 execute btc --remote --file=./schema.sql
# Worker 发布后：
#   npx wrangler deploy

name = "btc"
keep_vars = true # Preserve existing runtime variables during code-only channel releases.
main = "binance-klines-worker.js"
compatibility_date = "2024-12-01"
workers_dev = true
preview_urls = true

[[routes]]
pattern = "btc.feiniwork.com"
custom_domain = true
zone_name = "feiniwork.com"

# Placement Hint：将请求处理放在东京附近，减少上游地区限制与往返延迟。
# 该提示不保证上游可用；Cron 和源站健康仍须独立核验。
[placement]
region = "aws:ap-northeast-1"

# D1 数据库绑定：Worker 里用 env.DB 访问已部署 D1。
# database_id：在控制台创建或与 `wrangler d1 create` 输出对齐后填入。
[[d1_databases]]
binding = "DB"
database_name = "btc"
database_id = "de758bb8-c7f5-41c7-a6ea-32c0ddf74d57"

[[durable_objects.bindings]]
name = "LIQUIDATION_COLLECTOR"
class_name = "LiquidationCollector"

[[durable_objects.bindings]]
name = "KLINE_LIVE_COLLECTOR"
class_name = "KlineLiveCollector"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LiquidationCollector"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["KlineLiveCollector"]

# 已恢复：每分钟调度行情、足迹、强平与衍生品增量同步。

[triggers]
crons = ["* * * * *"]

# 可选：Gemini（与 yuqing 共用 Secret 名 GEMINI_API_KEY / GOOGLE_API_KEY）
#   npx wrangler secret put GEMINI_API_KEY
# LLM：`BTC_LLM_PROVIDER=none|gemini|auto`（默认 auto，有密钥则视为可用；亦可在控制台设置）
[vars]
FINANCE_D1_ENABLED = "true"
BTC_LLM_PROVIDER = "auto"
BINANCE_FAPI_ORIGIN = "https://bit-egress.feiniwork.com"
BINANCE_FSTREAM_ORIGIN = "https://bit-egress.feiniwork.com"
BINANCE_SPOT_ORIGIN = "https://bit-egress.feiniwork.com/x/spot"
BINANCE_SAPI_ORIGIN = "https://bit-egress.feiniwork.com/x/sapi"
BYBIT_API_ORIGIN = "https://bit-egress.feiniwork.com/x/bybit"
BYBIT_STREAM_ORIGIN = "https://bit-egress.feiniwork.com/x/bybit-stream"
OKX_API_ORIGIN = "https://bit-egress.feiniwork.com/x/okx"
BITGET_API_ORIGIN = "https://bit-egress.feiniwork.com/x/bitget"
DERIBIT_API_ORIGIN = "https://bit-egress.feiniwork.com/x/deribit"
ACCESS_ALLOWED_ORIGINS = "https://bitcoin.feiniwork.com,http://localhost:5173,http://127.0.0.1:5173"
# Cloudflare Access JWT defense-in-depth:
# 1) Create an Access self-hosted app for btc.feiniwork.com/*.
# 2) Copy the app AUD tag and set ACCESS_AUD in the Cloudflare dashboard.
# 3) Set ACCESS_TEAM_DOMAIN to <your-team>.cloudflareaccess.com.
# 4) Set ACCESS_JWT_REQUIRED=true after both values are present.
# ACCESS_TEAM_DOMAIN = "CHANGE_ME.cloudflareaccess.com"
# ACCESS_AUD = "CHANGE_ME"
# ACCESS_ALLOWED_EMAILS = "you@example.com"
# ACCESS_JWT_REQUIRED = "true"

# 出口反代：灰云 bit-egress.feiniwork.com。先机外带密钥探测 200，再把 BINANCE_FAPI_ORIGIN
# 写成 https://bit-egress.feiniwork.com ；A2 再写 BINANCE_FSTREAM_ORIGIN。密钥用
# wrangler secret put EGRESS_PROXY_SECRET，不要写进本文件。
# 阶段 B REST：灰云前缀 + joinEgress。Deribit 期权摘要走 /x/deribit，6 小时一次。
# Bybit 强平 WS：Caddy /x/bybit-stream 机外 101 之后才写 BYBIT_STREAM_ORIGIN；清空则回官方 wss://stream.bybit.com。
# sslip.io 仍在 Caddy 上作为回退；回退时把 BINANCE_FAPI/FSTREAM 改回 https://45.32.40.84.sslip.io 再部署。
# 不要橙云。不要在反代未通时只改 origin。
# SYMBOLS：默认 BTCUSDT。本系统行情数据以比特币为主，一般不配置多交易对。
#
# 静态前端（Cloudflare Pages）：在仓库根目录执行 npm run deploy:pages（project-name=bit-trading-desk）。
# deploy 脚本含 --branch main：与控制台 production branch 一致；若本地在 master 且省略 --branch，直连上传会落入 Preview，自定义域仍指向旧 Production。
# 部署成功后脚本会自动 prune：production/preview 各自仅保留最新 BIT_PAGES_KEEP 条（默认 8）。
# 首次需先创建项目：npx wrangler pages project create bit-trading-desk --production-branch=main
# 绑定自定义域：控制台 Workers & Pages → bit-trading-desk → Custom domains。
